version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: lms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: LMS
    ports:
      - '5432:5432'
    volumes:
      - lms-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  lms-pg-data:
